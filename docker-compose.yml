services:
  postgres:
    image: postgres:18-alpine
    container_name: ana_orthodox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ana_orthodox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ana_orthodox_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ana_orthodox_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ana_orthodox} -d ${POSTGRES_DB:-ana_orthodox_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ana_orthodox_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ana_orthodox_postgres_data
  redis_data:
    name: ana_orthodox_redis_data
