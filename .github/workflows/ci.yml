name: Ana Orthodox Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Mandatory Quality Gates (10 Gates)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js (v26 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Gate 1 — Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate 2 — Type Checking
        run: pnpm run type-check

      - name: Gate 3 — Code Linting
        run: pnpm run lint

      - name: Gate 4 — Format Check
        run: pnpm run format:check

      - name: Gate 5 — Unit Tests
        run: pnpm run test:unit

      - name: Gate 6 — Monorepo Build
        run: pnpm run build

      - name: Gate 7 — Dependency Audit
        run: pnpm audit --prod --audit-level=high

      - name: Gate 8 — Documentation Integrity
        run: |
          echo "Verifying presence of core docs..."
          test -f docs/project/PROJECT_MANIFEST.md
          test -f docs/architecture/TECHNOLOGY_BASELINE.md
          test -f docs/testing/QUALITY_GATES.md
          echo "All core documentation verified."
