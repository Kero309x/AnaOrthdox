name: Ana Orthodox quality checks
on:
  push:
    branches: [main, 'review/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ana_test
          POSTGRES_PASSWORD: local_ci_test_only
          POSTGRES_DB: ana_orthodox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ana_test -d ana_orthodox_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ana_test:local_ci_test_only@localhost:5432/ana_orthodox_test
      ALLOW_TEST_DATABASE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all packages before checking their compiled tests
        run: pnpm run build
      - run: pnpm run type-check
      - run: pnpm run lint
      - run: pnpm run test
      - name: Apply baseline to fresh test database only
        run: pnpm --filter @ana-orthodox/api prisma:migrate:deploy
      - name: Auth flow against real PostgreSQL
        run: pnpm --filter @ana-orthodox/api test:database
      - name: Install browser
        run: pnpm --filter @ana-orthodox/web exec playwright install --with-deps chromium
      - name: Arabic RTL browser matrix
        run: pnpm --filter @ana-orthodox/web test:e2e
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
